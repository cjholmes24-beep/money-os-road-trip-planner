name: Suitcase Brain checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check scripts/check-google-indexing-readiness.js
          node --check tests/gsc-indexing-tests.js
          node --check tests/browser-homepage-smoke.js
          node --check tests/homepage-tests.js
          node --check tests/consumer-planner-tests.js
          node --check tests/browser-planner-smoke.js
          node --check tests/browser-organic-smoke.js
          node --check organic-demand-engine.js
          node --check organic-acquisition-ui.js
          node --check flight-driving-comparison-ui.js
          node --check scripts/organic-site-audit.js
          node --check scripts/run-organic-demand.js
          node --check revenue-intelligence.js
          node --check revenue-ui.js
          node --check tests/first-dollar-tests.js
          node --check event-intelligence.js
          node --check trip-intelligence.js
          node --check source-intelligence.js
          node --check transport-lodging-intelligence.js
          node --check plan-my-trip/planner-ui.js
          node --check script.js
      - name: Suitcase Brain unit checks
        run: node tests/run-tests.js
      - name: Google verification installer regression tests
        run: python3 -m unittest discover -s tests -p test_google_verification.py
      - name: Google indexing readiness
        run: node scripts/check-google-indexing-readiness.js
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
      - name: Static site validation
        run: python3 tests/validate-site.py
      - name: Organic opportunity and distribution validation
        run: node scripts/run-organic-demand.js --check
      - name: Validate checked-in JSON
        run: |
          python3 -m json.tool data/google-indexing-targets.json >/dev/null
          python3 -m json.tool data/organic-opportunities-latest.json >/dev/null
          python3 -m json.tool data/private-import-example/search-performance.example.json >/dev/null
          python3 -m json.tool data/monetization-opportunity-registry.json >/dev/null
          python3 -m json.tool data/event-source-registry.json >/dev/null
          python3 -m json.tool data/source-registry.json >/dev/null
          python3 -m json.tool data/eia-gas-latest.json >/dev/null
          python3 -m json.tool data/provider-capability-registry.json >/dev/null

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/homepage-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/homepage-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Homepage, planner, and organic browser regressions
        env:
          NODE_PATH: ${{ runner.temp }}/homepage-browser/node_modules
          SUITCASE_SCREENSHOTS: ${{ runner.temp }}/homepage-screenshots
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/homepage-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PYWAIT'
          import time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/', timeout=1) as response:
                      assert response.status == 200
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Local static server did not become ready.')
          PYWAIT
          node tests/browser-homepage-smoke.js
          node tests/browser-organic-smoke.js
          node tests/browser-planner-smoke.js
      - name: Save homepage viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-viewport-screenshots
          path: ${{ runner.temp }}/homepage-screenshots/
          retention-days: 7
