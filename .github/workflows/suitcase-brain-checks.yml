name: Suitcase Brain checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check tests/browser-organic-smoke.js
          node --check organic-demand-engine.js
          node --check organic-acquisition-ui.js
          node --check flight-driving-comparison-ui.js
          node --check scripts/organic-site-audit.js
          node --check scripts/run-organic-demand.js
          node --check revenue-intelligence.js
          node --check revenue-ui.js
          node --check tests/first-dollar-tests.js
          node --check event-intelligence.js
          node --check trip-intelligence.js
          node --check source-intelligence.js
          node --check transport-lodging-intelligence.js
          node --check plan-my-trip/planner-ui.js
          node --check script.js
      - name: Suitcase Brain unit checks
        run: node tests/run-tests.js
      - name: Static site validation
        run: python3 tests/validate-site.py
      - name: Organic opportunity and distribution validation
        run: node scripts/run-organic-demand.js --check
      - name: Validate checked-in JSON
        run: |
          python3 -m json.tool data/organic-opportunities-latest.json >/dev/null
          python3 -m json.tool data/private-import-example/search-performance.example.json >/dev/null
          python3 -m json.tool data/monetization-opportunity-registry.json >/dev/null
          python3 -m json.tool data/event-source-registry.json >/dev/null
          python3 -m json.tool data/source-registry.json >/dev/null
          python3 -m json.tool data/eia-gas-latest.json >/dev/null
          python3 -m json.tool data/provider-capability-registry.json >/dev/null
